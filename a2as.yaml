manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: gdg-pvd/gdg-community
    source: https://github.com/gdg-pvd/gdg-community
    branch: main
    commit: "27ae6d40"
    scope: [src/agents/content_agent.py, src/agents/core_agent.py, src/agents/knowledge_agent.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:50:56Z'
    url: https://a2as.org/certified/agents/gdg-pvd/gdg-community
  signatures:
    digest: sha256:xjOzCDWkZmlH3QAr7q5xAT3vSwtq5TQv4qaYki996d8
    key: ed25519:B4ZtOyDI0WsRarwNOWDquytxGBPNEXF97xXyMsYcgZc
    sig: ed25519:6_sNWg42b5xLuHg-a_efWrA-cdOBHCdECru2lgt9aXAbYktY5u71cYv8tBrc1TRYpTTc7elw2bpiLfQrY19eAA

agents:
  agent.ContentAgent.agent:
    type: class
    models: [self.model_name]
    tools: [Tool, Tool, Tool, Tool, Tool, Tool, Tool]
    params:
      name: content_specialist_{self.chapter_id}
      description: Creates optimized social media content based on chapter guidelines and past performance
      class: ContentAgent
  agent.CoreAgent.agent:
    type: class
    models: [self.model_name]
    tools: [Tool, Tool, Tool, Tool, Tool, Tool]
    params:
      name: gdg_{self.chapter_id}_assistant
      description: Community assistant for {self.chapter_id} that manages knowledge and content generation
      class: CoreAgent
  agent.KnowledgeAgent.agent:
    type: class
    models: [self.model_name]
    tools: [Tool, Tool, Tool, Tool, Tool]
    params:
      name: knowledge_specialist_{self.chapter_id}
      description: Manages the three-layer knowledge architecture for the GDG chapter
      class: KnowledgeAgent

models:
  self.model_name:
    type: literal
    agents: [agent.KnowledgeAgent.agent, agent.CoreAgent.agent, agent.ContentAgent.agent]

imports:
